name: Release validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  api-contracts:
    name: Supabase API contracts
    runs-on: ubuntu-latest
    environment: release-validation
    env:
      API_CONTRACT_SUPABASE_URL: ${{ secrets.API_CONTRACT_SUPABASE_URL }}
      API_CONTRACT_SUPABASE_ANON_KEY: ${{ secrets.API_CONTRACT_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: artifacts/teacher-growth-platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release workflow protection
        run: node scripts/check-release-workflow.mjs
        working-directory: .

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run read-only API contract checks
        run: npm run check:api-contracts
